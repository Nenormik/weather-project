<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            min-height: 100vh;
            padding: 20px;
        }
        .weather-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .weather-icon {
            font-size: 4rem;
            margin: 20px 0;
        }
        .history-item, .favorite-item {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            margin-bottom: 10px;
            padding: 10px;
        }
        .loading {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="weather-card p-4 mb-4">
                    <h1 class="text-center mb-4"><i class="fas fa-cloud-sun"></i> Weather App</h1>
                    
                    <div class="input-group mb-3">
                        <input type="text" id="cityInput" class="form-control" placeholder="Enter city name...">
                        <button class="btn btn-primary" type="button" id="searchBtn">
                            <i class="fas fa-search"></i> Search
                        </button>
                    </div>
                    
                    <div class="loading text-center" id="loading">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    
                    <div id="weatherResult"></div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="weather-card p-3">
                            <h4><i class="fas fa-star"></i> Favorite Cities</h4>
                            <div id="favoritesList"></div>
                            <button class="btn btn-sm btn-outline-primary" id="refreshFavorites">
                                <i class="fas fa-sync"></i> Refresh
                            </button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="weather-card p-3">
                            <h4><i class="fas fa-history"></i> Recent Searches</h4>
                            <div id="historyList"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Функция для получения погоды
        async function getWeather(city) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('weatherResult').innerHTML = '';
            
            try {
                const response = await fetch(`/weather?city=${encodeURIComponent(city)}`);
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                
                if (data.error) {
                    document.getElementById('weatherResult').innerHTML = `
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle"></i> ${data.error}
                        </div>
                    `;
                } else {
                    const iconUrl = `https://openweathermap.org/img/wn/${data.icon}@2x.png`;
                    document.getElementById('weatherResult').innerHTML = `
                        <div class="text-center">
                            <h2>${data.city}, ${data.country}</h2>
                            <img src="${iconUrl}" alt="${data.description}" class="weather-icon">
                            <h3>${data.temperature}°C</h3>
                            <p class="lead">${data.description}</p>
                            <div class="row text-start">
                                <div class="col-6">
                                    <p><i class="fas fa-thermometer-half"></i> Feels like: ${data.feels_like}°C</p>
                                    <p><i class="fas fa-tint"></i> Humidity: ${data.humidity}%</p>
                                </div>
                                <div class="col-6">
                                    <p><i class="fas fa-tachometer-alt"></i> Pressure: ${data.pressure} hPa</p>
                                    <p><i class="far fa-clock"></i> ${data.timestamp}</p>
                                </div>
                            </div>
                            <button class="btn btn-success" onclick="addToFavorites('${data.city}')">
                                <i class="fas fa-star"></i> Add to Favorites
                            </button>
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('weatherResult').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i> Connection error: ${error.message}
                    </div>
                `;
            }
        }
        
        // Добавить в избранное
        async function addToFavorites(city) {
            try {
                await fetch('/favorites/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({city: city})
                });
                loadFavorites();
            } catch (error) {
                console.error('Error adding to favorites:', error);
            }
        }
        
        // Удалить из избранного
        async function removeFromFavorites(city) {
            try {
                await fetch('/favorites/remove', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({city: city})
                });
                loadFavorites();
            } catch (error) {
                console.error('Error removing from favorites:', error);
            }
        }
        
        // Загрузить избранные города
        async function loadFavorites() {
            try {
                const response = await fetch('/favorites');
                const favorites = await response.json();
                
                let html = '';
                if (favorites.length === 0) {
                    html = '<p class="text-muted">No favorite cities yet</p>';
                } else {
                    favorites.forEach(city => {
                        html += `
                            <div class="favorite-item d-flex justify-content-between align-items-center">
                                <span>${city}</span>
                                <div>
                                    <button class="btn btn-sm btn-outline-primary me-1" onclick="getWeather('${city}')">
                                        <i class="fas fa-search"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="removeFromFavorites('${city}')">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                }
                document.getElementById('favoritesList').innerHTML = html;
            } catch (error) {
                console.error('Error loading favorites:', error);
            }
        }
        
        // Загрузить историю
        async function loadHistory() {
            try {
                const response = await fetch('/history');
                const history = await response.json();
                
                let html = '';
                if (history.length === 0) {
                    html = '<p class="text-muted">No search history yet</p>';
                } else {
                    history.slice().reverse().forEach(item => {
                        html += `
                            <div class="history-item">
                                <div class="d-flex justify-content-between">
                                    <strong>${item.city}</strong>
                                    <span>${item.temperature}°C</span>
                                </div>
                                <small class="text-muted">${item.timestamp}</small>
                                <button class="btn btn-sm btn-outline-primary mt-1" onclick="getWeather('${item.city}')">
                                    <i class="fas fa-sync"></i> Refresh
                                </button>
                            </div>
                        `;
                    });
                }
                document.getElementById('historyList').innerHTML = html;
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            // Обработчик поиска
            document.getElementById('searchBtn').addEventListener('click', function() {
                const city = document.getElementById('cityInput').value.trim();
                if (city) {
                    getWeather(city);
                }
            });
            
            // Обработчик Enter
            document.getElementById('cityInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const city = document.getElementById('cityInput').value.trim();
                    if (city) {
                        getWeather(city);
                    }
                }
            });
            
            // Обработчик обновления избранных
            document.getElementById('refreshFavorites').addEventListener('click', loadFavorites);
            
            // Загрузка начальных данных
            loadFavorites();
            loadHistory();
            
            // Обновление истории каждые 30 секунд
            setInterval(loadHistory, 30000);
        });
    </script>
</body>
</html>
