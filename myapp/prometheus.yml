global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'my_app'
    static_configs:
      - targets: ['192.168.1.38:8099']  # Заменить на порт вашего приложения

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['192.168.1.38:9100']  # Если используете --network=host

   - job_name: 'cadvisor'
    static_configs:
      - targets: ['192.168.1.38:8091']  # Порт cAdvisor
    scrape_interval: 10s  # Можно чаще для метрик контейнеров
